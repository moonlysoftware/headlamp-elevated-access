name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z)
        required: true
        type: string
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - name: Build, package and update Artifact Hub metadata
        id: build
        run: |
          scripts/release.sh "${{ inputs.version }}" | tee release.log
          grep -E '^(tarball|checksum)=' release.log >> "$GITHUB_OUTPUT"
          rm release.log
      - name: Commit metadata and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json artifacthub-pkg.yml
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD "v${{ inputs.version }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "${{ steps.build.outputs.tarball }}" \
            --title "v${{ inputs.version }}" \
            --notes "Archive SHA256: ${{ steps.build.outputs.checksum }}"
